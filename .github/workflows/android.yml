name: Build for Android

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Decode Android keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/upload-keystore.jks"
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Create key.properties
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          printf 'storeFile=%s\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
            "$KEYSTORE_PATH" "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" \
            > filcnaplo/android/key.properties

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Install Flutter 3.16.0 (official)
        run:
        wget https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.16.0-stable.tar.xz
        tar -xf flutter_linux_3.16.0-stable.tar.xz
        echo "$PWD/flutter/bin" >> $GITHUB_PATH
        cho "$PWD/flutter/bin/cache/dart-sdk/bin" >> $GITHUB_PATH


      - name: Verify Flutter version
        run: flutter --version

      - name: Flutter doctor
        run: flutter doctor

      - name: Install dependencies
        run: ./fix-pub.sh

      - name: Build
        run: cd filcnaplo && ./build.sh

      - name: Upload Android Release
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            filcnaplo/build/app/outputs/flutter-apk/app-release.apk
            build/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
